apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ .Values.topic.name | kebabcase }}
  namespace: {{ .Values.kafka.namespace }}
  labels:
    strimzi.io/cluster: {{ .Values.kafka.cluster }}
    {{- include "sre-challenge.labels" . | nindent 4 }}
spec:
  topicName: {{ .Values.topic.name }}
  partitions: {{ .Values.topic.partitions }}
  replicas: {{ .Values.topic.replicas }}
